<h1 class="entry-title">傍晚散步</h1>
<p class="entry-date">2026年11月13日 星期五</p>
<p>晚上出门走了一圈，风比前几天凉一些。</p><p>路过熟悉的街角，买了一杯热饮。回来的时候想，今天大概可以记两笔：一笔写做了什么，一笔写当时的心情。</p><ul><li><p>天色暗得比上周更早</p></li><li><p>路灯下有人遛狗</p></li><li><p>回家后把明天的待办写好了</p></li></ul><p>一天里有两段值得留下的时刻，也挺好。</p>
